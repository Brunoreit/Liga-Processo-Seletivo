services:

  postgres:
    image: postgres:16-alpine
    container_name: liga_postgres
    
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data




  backend:
    build: ./backend
    container_name: liga_backend

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      -postgres

    
  frontend:
  build: ./frontend
  container_name: liga_frontend

  volumes:
    - ./frontend:/app
    - /app/node_modules

  ports:
    - "5173:5173"

  env_file:
    - .env

  depends_on:
    - backend

volumes:
  postgres_data: